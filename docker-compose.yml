# Local databases for #4 Legal Contract Review.
# Its OWN stack: separate containers, separate volumes, separate ports from #1.
# Host ports are shifted so both projects can run at the same time:
#   Postgres 5433 (#1 uses 5432), Weaviate 8081 / 50052 (#1 uses 8080 / 50051).
# Start:  docker compose up -d      Stop:  docker compose down
# Wipe this project's data only (never touches #1):  docker compose down -v
name: legal-contract-review
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.38.2
    ports:
      - "8081:8080"      # REST API (what we talk to from Python)
      - "50052:50051"    # gRPC API (faster channel the client also uses)
    restart: on-failure:0
    environment:
      CLUSTER_HOSTNAME: 'node1'
      CLUSTER_ADVERTISE_ADDR: '127.0.0.1'
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_API_BASED_MODULES: 'true'
    volumes:
      - weaviate_data:/var/lib/weaviate

  postgres:
    image: postgres:17
    ports:
      - "5433:5432"
    restart: on-failure:0
    environment:
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: c9419f7b57176faac1b7439842937d3b
      POSTGRES_DB: contracts
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  weaviate_data:
  pgdata:
