[project]
name = "legal-contract-review"
version = "0.1.0"
description = "Papyrus: multi-agent legal contract review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.138.2",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.7",
    "psycopg[binary]>=3.3.4",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.32",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.49.0",
    "weaviate-client>=4.22.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.1",   # make_contracts.py only: regenerates the synthetic corpus, which is committed
    "pytest>=8.3.0",
]
