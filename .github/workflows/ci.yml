name: ci

on: [push, pull_request]

env:
  # dummies: the suite never calls a model or a database, but the app
  # fail-fast checks these exist at import time
  PRIVATE_LANE_URL: https://example.invalid/lane
  PRIVATE_LANE_TOKEN: ci-dummy
  AUTH_SECRET: ci-dummy-secret
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next build
